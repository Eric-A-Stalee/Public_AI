<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>career.compass — figure out what to actually do</title>
<style>
:root {
  --bg: #07080b;
  --bg-1: #0d0f14;
  --bg-2: #141821;
  --bg-3: #1c2230;
  --border: #262d3c;
  --border-2: #353e52;
  --text: #e7eaf0;
  --text-2: #aab2c2;
  --text-3: #6a7385;
  --accent: #6ee7ff;
  --accent-2: #ff8a3d;
  --good: #6ee7a8;
  --warn: #ffd76e;
  --bad: #ff7a7a;
  --shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 8px 30px rgba(0,0,0,0.5);
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(1200px 800px at 80% -10%, #11233055, transparent 60%),
              radial-gradient(900px 700px at -10% 110%, #25101a55, transparent 60%),
              var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, kbd, .mono { font-family: var(--mono); }

header {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(7,8,11,0.7);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 50;
}
header .brand {
  font-family: var(--mono);
  font-weight: 600;
  letter-spacing: -0.02em;
  font-size: 15px;
  color: var(--text);
}
header .brand .dot { color: var(--accent); }
header .brand .sub { color: var(--text-3); font-weight: 400; margin-left: 8px; }
header nav { display: flex; gap: 4px; margin-left: auto; align-items: center; }
header nav button {
  background: transparent; border: 1px solid transparent; color: var(--text-2);
  padding: 6px 12px; border-radius: 8px; font-family: var(--mono); font-size: 13px;
  cursor: pointer; transition: all .12s ease;
}
header nav button:hover { color: var(--text); background: var(--bg-2); }
header nav button.active { color: var(--accent); border-color: var(--border-2); background: var(--bg-2); }
header .progress {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 12px; color: var(--text-3);
  padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
  background: var(--bg-1);
}
header .progress .bar { width: 80px; height: 4px; background: var(--bg-3); border-radius: 999px; overflow: hidden; }
header .progress .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); width: 0%; transition: width .3s ease; }

main { max-width: 920px; margin: 0 auto; padding: 32px 24px 120px; }
h1, h2, h3 { letter-spacing: -0.02em; margin: 0 0 12px; }
h1 { font-size: 32px; font-weight: 700; }
h2 { font-size: 22px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.kbd { font-family: var(--mono); font-size: 12px; background: var(--bg-3); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border); }

.card {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.card.hover:hover { border-color: var(--border-2); }

.btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
  padding: 10px 16px; border-radius: 10px; font-family: var(--mono); font-size: 13px;
  cursor: pointer; transition: all .12s ease;
}
.btn:hover { border-color: var(--border-2); background: var(--bg-3); }
.btn.primary { background: linear-gradient(135deg, #1b3d4a, #1a2330); border-color: #2c5b6e; color: var(--accent); }
.btn.primary:hover { border-color: var(--accent); }
.btn.warm { background: linear-gradient(135deg, #3a2418, #261810); border-color: #5c3a23; color: var(--accent-2); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: #3a2026; background: #1c1014; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

input[type=text], input[type=password], input[type=number], textarea, select {
  width: 100%;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
label { display: block; font-family: var(--mono); font-size: 12px; color: var(--text-3); margin-bottom: 6px; }

/* HOME */
.hero { display: grid; grid-template-columns: 1fr; gap: 24px; }
.hero .tagline { font-size: 13px; color: var(--text-3); font-family: var(--mono); margin-bottom: 8px; }
.hero h1 { font-size: 40px; line-height: 1.1; }
.hero h1 .accent { color: var(--accent); }
.hero p.lede { font-size: 17px; color: var(--text-2); max-width: 640px; }
.depth-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
@media (max-width: 760px) { .depth-grid { grid-template-columns: 1fr; } }
.depth-card { padding: 20px; cursor: pointer; transition: all .15s ease; }
.depth-card:hover { transform: translateY(-2px); border-color: var(--border-2); }
.depth-card .tag { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.05em; }
.depth-card h3 { margin: 6px 0 6px; }
.depth-card .meta { font-family: var(--mono); font-size: 12px; color: var(--text-3); margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }

/* QUIZ */
.qhead {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 12px; color: var(--text-3); margin-bottom: 24px;
}
.qhead .right { display: flex; gap: 8px; align-items: center; }
.qcard {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px;
  box-shadow: var(--shadow);
  min-height: 360px;
}
.qcategory { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 12px; }
.qtext { font-size: 22px; font-weight: 500; line-height: 1.35; margin-bottom: 28px; letter-spacing: -0.01em; }
.qhint { color: var(--text-3); font-size: 13px; margin-top: -16px; margin-bottom: 24px; }
.qactions { display: flex; justify-content: space-between; margin-top: 24px; align-items: center; gap: 8px; }
.qactions .right { display: flex; gap: 8px; }

/* Likert */
.likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.likert button {
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2);
  padding: 16px 8px; border-radius: 10px; cursor: pointer; font-family: var(--mono); font-size: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  transition: all .12s ease;
}
.likert button:hover { border-color: var(--border-2); color: var(--text); }
.likert button.selected { background: linear-gradient(135deg,#163240,#0e1a22); border-color: var(--accent); color: var(--accent); }
.likert button .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; opacity: 0.4; }
.likert button.selected .dot { opacity: 1; }

/* Slider */
.slider-row { display: flex; gap: 14px; align-items: center; margin-top: 16px; }
.slider-row .label { flex: 0 0 30%; font-family: var(--mono); font-size: 12px; color: var(--text-2); }
.slider-row .label.right { text-align: right; }
.slider-row input[type=range] {
  flex: 1;
  -webkit-appearance: none; appearance: none;
  height: 6px; background: var(--bg-3); border-radius: 999px; outline: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer; border: 2px solid var(--bg);
  box-shadow: 0 0 0 2px var(--border-2);
}
.slider-row input[type=range]::-moz-range-thumb {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  cursor: pointer; border: 2px solid var(--bg);
}
.slider-val { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-top: 12px; text-align: center; }

/* Binary cards */
.binary { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .binary { grid-template-columns: 1fr; } }
.binary .opt {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; cursor: pointer; transition: all .15s ease;
  display: flex; flex-direction: column; gap: 10px; min-height: 140px;
}
.binary .opt:hover { border-color: var(--border-2); transform: translateY(-2px); }
.binary .opt.selected { background: linear-gradient(135deg,#163240,#0e1a22); border-color: var(--accent); }
.binary .opt .tag { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.binary .opt .body { font-size: 15px; color: var(--text); line-height: 1.5; }

/* Multi-select chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button {
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2);
  padding: 8px 14px; border-radius: 999px; cursor: pointer; font-family: var(--mono); font-size: 13px;
  transition: all .12s ease;
}
.chips button:hover { border-color: var(--border-2); color: var(--text); }
.chips button.selected { background: #163240; border-color: var(--accent); color: var(--accent); }

/* Ranking */
.rank-list { display: flex; flex-direction: column; gap: 8px; }
.rank-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px;
}
.rank-item .num { font-family: var(--mono); color: var(--accent); width: 24px; }
.rank-item .body { flex: 1; }
.rank-item .ctrls button {
  background: var(--bg-3); border: 1px solid var(--border); color: var(--text-2);
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-family: var(--mono);
}
.rank-item .ctrls button:hover { color: var(--text); border-color: var(--border-2); }
.rank-item .ctrls { display: flex; gap: 4px; }

/* Single-select cards */
.single-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (max-width: 700px) { .single-cards { grid-template-columns: 1fr; } }
.single-cards .opt {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px; cursor: pointer; transition: all .12s ease;
  display: flex; align-items: center; gap: 12px;
}
.single-cards .opt:hover { border-color: var(--border-2); }
.single-cards .opt.selected { background: #163240; border-color: var(--accent); color: var(--accent); }
.single-cards .opt .radio { width: 16px; height: 16px; border: 2px solid currentColor; border-radius: 50%; opacity: 0.5; flex-shrink: 0; }
.single-cards .opt.selected .radio { background: var(--accent); opacity: 1; box-shadow: inset 0 0 0 3px var(--bg-1); }

/* Numeric */
.numeric { display: flex; gap: 12px; align-items: center; }
.numeric input { width: 200px; font-size: 22px; padding: 14px; text-align: center; }
.numeric .suffix { font-family: var(--mono); color: var(--text-3); }

/* Work sample energy meter */
.energy {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
}
.energy button {
  background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2);
  padding: 16px 8px; border-radius: 10px; cursor: pointer; font-family: var(--mono); font-size: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; transition: all .12s ease;
}
.energy button:hover { border-color: var(--border-2); color: var(--text); }
.energy button.selected { border-color: var(--accent); }
.energy button .emo { font-size: 24px; }
.energy button.selected.lvl-0 { background: #2a1418; color: #ff9a9a; border-color: #ff7a7a; }
.energy button.selected.lvl-1 { background: #281c14; color: #ffb37a; border-color: #ff9d5a; }
.energy button.selected.lvl-2 { background: #1e2024; color: #d0d3da; border-color: #555; }
.energy button.selected.lvl-3 { background: #14241c; color: #9aff9a; border-color: #6ee7a8; }
.energy button.selected.lvl-4 { background: #14282c; color: #6ee7ff; border-color: #6ee7ff; }

/* Image preference grid */
.imgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 700px) { .imgrid { grid-template-columns: repeat(2, 1fr); } }
.imgrid .opt {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 16px 10px; cursor: pointer; transition: all .12s ease;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  position: relative;
  text-align: center;
}
.imgrid .opt:hover { border-color: var(--border-2); transform: translateY(-2px); }
.imgrid .opt.selected { background: #163240; border-color: var(--accent); }
.imgrid .opt .emo { font-size: 36px; }
.imgrid .opt .lbl { font-family: var(--mono); font-size: 11px; color: var(--text-2); }
.imgrid .opt .badge {
  position: absolute; top: 6px; right: 6px;
  background: var(--accent); color: var(--bg); width: 20px; height: 20px;
  border-radius: 50%; font-family: var(--mono); font-size: 11px; font-weight: 700;
  display: none; align-items: center; justify-content: center;
}
.imgrid .opt.selected .badge { display: flex; }

/* Results */
.match {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.match .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.match h2 { font-size: 22px; margin: 0; }
.match .conf { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
.match .conf .pct { color: var(--accent); font-size: 18px; }
.match .why { color: var(--text-2); margin: 12px 0; }
.match .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
@media (max-width: 700px) { .match .grid { grid-template-columns: 1fr; } }
.match .panel { background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.match .panel h4 { margin: 0 0 8px; font-family: var(--mono); font-size: 11px; color: var(--text-3); letter-spacing: 0.05em; text-transform: uppercase; }
.match .panel ul { margin: 0; padding-left: 18px; }
.match .panel li { margin-bottom: 4px; font-size: 13px; }
.ai-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: var(--bg-2); border: 1px solid var(--border);
}
.ai-pill .score { font-weight: 700; }
.ai-pill.lvl-low { color: var(--bad); border-color: #5c2530; }
.ai-pill.lvl-med { color: var(--warn); border-color: #5c4825; }
.ai-pill.lvl-high { color: var(--good); border-color: #25553a; }
.salary-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.salary-row .cell { background: var(--bg-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; text-align: center; }
.salary-row .cell .lbl { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
.salary-row .cell .val { font-family: var(--mono); color: var(--accent); font-size: 14px; margin-top: 2px; }

/* Followup chat */
.chat { display: flex; flex-direction: column; gap: 12px; }
.bubble { padding: 12px 16px; border-radius: 12px; max-width: 80%; line-height: 1.55; }
.bubble.user { align-self: flex-end; background: linear-gradient(135deg,#163240,#0e1a22); border: 1px solid var(--border-2); }
.bubble.bot { align-self: flex-start; background: var(--bg-2); border: 1px solid var(--border); }
.chatbox { display: flex; gap: 8px; margin-top: 16px; }
.chatbox input { flex: 1; }

/* Misc */
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--bg-2); border: 1px solid var(--border-2); color: var(--text);
  padding: 10px 18px; border-radius: 999px; font-family: var(--mono); font-size: 13px;
  z-index: 100; box-shadow: var(--shadow);
  opacity: 0; transition: opacity .2s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: spin .8s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.stretch-card { background: var(--bg-2); border: 1px dashed var(--border-2); border-radius: 10px; padding: 14px; margin-bottom: 8px; }
.stretch-card .title { color: var(--accent-2); font-weight: 600; }

.overall {
  background: linear-gradient(135deg, #112230, #0b1218);
  border: 1px solid #1d3a4a;
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 18px;
}
.overall .label { font-family: var(--mono); font-size: 11px; color: var(--accent); letter-spacing: 0.08em; }
.overall .body { font-size: 17px; line-height: 1.55; margin-top: 8px; }

details.code-fold { margin-top: 8px; }
details.code-fold summary { cursor: pointer; font-family: var(--mono); font-size: 12px; color: var(--text-3); }
details.code-fold pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12px; max-height: 320px; }
</style>
</head>
<body>

<header>
  <div class="brand">career<span class="dot">.</span>compass<span class="sub">// for indian students figuring it out</span></div>
  <div class="progress" id="prog-pill" style="display:none;">
    <span id="prog-label">profile 0%</span>
    <div class="bar"><div id="prog-bar"></div></div>
  </div>
  <nav>
    <button data-route="home" id="nav-home">home</button>
    <button data-route="profile" id="nav-profile">profile</button>
    <button data-route="results" id="nav-results">results</button>
    <button data-route="settings" id="nav-settings">settings</button>
  </nav>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* ======================================================================
   CAREER COMPASS · single-file static app
   Fully LLM-driven (Anthropic API, BYO key). Persistent profile in localStorage.
   Mix-and-match any of the three quiz depths; answers merge into one profile.
   ====================================================================== */

const STORAGE_KEY = 'cc.profile.v1';
const SETTINGS_KEY = 'cc.settings.v1';
const RESULTS_KEY = 'cc.results.v1';
const CHAT_KEY = 'cc.chat.v1';

const DEFAULT_SETTINGS = {
  apiKey: '',
  model: 'claude-opus-4-7'
};

const MODELS = [
  { id: 'claude-opus-4-7', label: 'Opus 4.7 — best matching, slower & pricier' },
  { id: 'claude-sonnet-4-6', label: 'Sonnet 4.6 — balanced (default)' },
  { id: 'claude-haiku-4-5-20251001', label: 'Haiku 4.5 — fast & cheap, less nuanced' }
];

/* ======================================================================
   QUESTION BANK — categorised, multiple form types, three depths
   depth: which quiz mode includes this question
     - "quick"        ≈ 18 questions
     - "medium"       ≈ 40 questions (includes quick)
     - "comprehensive"≈ 90+ questions (includes medium)
   ====================================================================== */

const QUESTIONS = [

  /* ---------- META / context ---------- */
  { id:'meta_stage', type:'single-select', depth:['quick','medium','comprehensive'], category:'context',
    text:'Where are you in your education right now?',
    options:['In Class 9 or 10','In Class 11 or 12','Gap year / prepping for entrance exams','Undergraduate','Postgraduate','Already working, reconsidering'] },

  { id:'meta_stream', type:'single-select', depth:['quick','medium','comprehensive'], category:'context',
    text:'If you\'re in 11/12 or have completed it, which stream?',
    options:['Science — PCM','Science — PCB','Science — PCMB','Commerce','Arts / Humanities','Vocational','Not applicable / haven\'t chosen yet'] },

  { id:'meta_city_type', type:'single-select', depth:['medium','comprehensive'], category:'context',
    text:'What kind of place are you from?',
    options:['Tier-1 metro (Mumbai/Delhi/Bangalore/Chennai/Hyderabad/Kolkata/Pune)','Tier-2 city (state capital, big district)','Tier-3 town','Village / rural'] },

  { id:'meta_languages', type:'multi-select', depth:['medium','comprehensive'], category:'context',
    text:'Languages you\'re genuinely comfortable working in (reading + writing + speaking):',
    options:['English','Hindi','Tamil','Telugu','Kannada','Malayalam','Marathi','Gujarati','Bengali','Punjabi','Urdu','Odia','Assamese','Other'] },

  /* ---------- RIASEC + modern interests (likert) ---------- */
  { id:'int_realistic_1', type:'likert', depth:['quick','medium','comprehensive'], category:'interests',
    text:'I enjoy fixing or building physical things — bikes, electronics, furniture, anything I can hold.' },
  { id:'int_realistic_2', type:'likert', depth:['medium','comprehensive'], category:'interests',
    text:'Working outdoors or with my hands sounds more satisfying than sitting at a desk all day.' },

/* ======================================================================
   STORAGE
   ====================================================================== */
function loadJSON(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch { return fallback; }
}
function saveJSON(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

const Store = {
  profile() { return loadJSON(STORAGE_KEY, { answers: {}, completedAt: null, updatedAt: null }); },
  saveProfile(p) { p.updatedAt = new Date().toISOString(); saveJSON(STORAGE_KEY, p); updateProgressPill(); },
  settings() { return Object.assign({}, DEFAULT_SETTINGS, loadJSON(SETTINGS_KEY, {})); },
  saveSettings(s) { saveJSON(SETTINGS_KEY, s); },
  results() { return loadJSON(RESULTS_KEY, null); },
  saveResults(r) { saveJSON(RESULTS_KEY, r); },
  chat() { return loadJSON(CHAT_KEY, []); },
  saveChat(c) { saveJSON(CHAT_KEY, c); },
  clearAll() {
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(RESULTS_KEY);
    localStorage.removeItem(CHAT_KEY);
  }
};

/* ======================================================================
   PROGRESS / COMPLETENESS
   ====================================================================== */
function questionsForDepth(depth) {
  return QUESTIONS.filter(q => q.depth.includes(depth));
}
function profileCompleteness() {
  const p = Store.profile();
  const total = QUESTIONS.length;
  const done = Object.keys(p.answers || {}).filter(k => QUESTIONS.find(q => q.id === k)).length;
  return { done, total, pct: Math.round(100 * done / total) };
}
function updateProgressPill() {
  const { done, total, pct } = profileCompleteness();
  const pill = document.getElementById('prog-pill');
  if (!pill) return;
  if (done === 0) { pill.style.display = 'none'; return; }
  pill.style.display = 'flex';
  document.getElementById('prog-label').textContent = `profile ${pct}% (${done}/${total})`;
  document.getElementById('prog-bar').style.width = pct + '%';
}

/* ======================================================================
   ROUTER
   ====================================================================== */
const routes = {
  home: renderHome,
  settings: renderSettings,
  profile: renderProfileView,
  quiz: renderQuiz,
  results: renderResults
};
function go(route, params) {
  const url = '#/' + route + (params ? '?' + new URLSearchParams(params).toString() : '');
  if (location.hash !== url) { location.hash = url; }
  else { renderRoute(); }
}
function parseHash() {
  const h = location.hash.slice(2) || 'home';
  const [route, qs] = h.split('?');
  const params = qs ? Object.fromEntries(new URLSearchParams(qs)) : {};
  return { route, params };
}
function renderRoute() {
  const { route, params } = parseHash();
  document.querySelectorAll('header nav button').forEach(b => {
    b.classList.toggle('active', b.dataset.route === route);
  });
  const fn = routes[route] || renderHome;
  fn(params);
}

function formatAnswer(q, a) {
  if (a === null || a === undefined || a === '') return '—';
  if (q.type === 'likert') {
    const labels = ['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'];
    return labels[a-1] || a;
  }
  if (q.type === 'slider') {
    return `${a}${q.suffix||''}  ${q.left ? `(0=${q.left} → ${q.max}=${q.right})` : ''}`;
  }
  if (q.type === 'binary') {
    return a === 'A' ? `A — ${q.optionA}` : `B — ${q.optionB}`;
  }
  if (q.type === 'multi-select' || q.type === 'image-pref') {
    return Array.isArray(a) ? a.join(', ') : a;
  }
  if (q.type === 'ranking') {
    return Array.isArray(a) ? a.map((x,i)=>`${i+1}. ${x}`).join(' · ') : a;
  }
  if (q.type === 'single-select') return a;
  if (q.type === 'numeric') return `${a}${q.suffix?' '+q.suffix:''}`;
  if (q.type === 'work-sample') {
    return ['Draining','Meh','Okay','Engaged','Energized'][a] || a;
  }
  if (q.type === 'open-text') return a;
  return String(a);
}

function exportProfile() {
  const p = Store.profile();
  const data = JSON.stringify(p, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `career-compass-profile-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importProfile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const p = JSON.parse(reader.result);
      if (!p.answers) throw new Error('Invalid profile file');
      Store.saveProfile(p);
      toast('profile imported');
      renderRoute();
    } catch (err) {
      alert('Could not import: ' + err.message);
    }
  };
  reader.readAsText(file);
}

/* ---------- Quiz view ---------- */
let quizState = null;

function renderQuiz(params) {
  const depth = params.depth || 'quick';
  const p = Store.profile();
  let pool;
  if (depth === 'continue') {
    pool = QUESTIONS.filter(q => p.answers[q.id] === undefined);
  } else {
    pool = questionsForDepth(depth).filter(q => p.answers[q.id] === undefined);
  }
  if (pool.length === 0) {
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center; padding: 60px;">
        <h2>You're done with this set 🎉</h2>
        <p class="muted">Every question in <b>${depth}</b> mode is answered. Want to go deeper or see results?</p>
        <div class="row" style="justify-content:center; margin-top:16px;">
          <button class="btn primary" onclick="go('quiz',{depth:'comprehensive'})">go deeper →</button>
          <button class="btn warm" onclick="generateMatches()">generate matches →</button>
          <button class="btn" onclick="go('profile')">see profile →</button>
        </div>
      </div>`;
    return;
  }
  quizState = { pool, depth, idx: 0 };
  renderCurrentQuestion();
}

function renderCurrentQuestion() {
  if (!quizState) return;
  const { pool, depth, idx } = quizState;
  if (idx >= pool.length) {
    // finished this batch
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center; padding: 60px;">
        <h2>Batch complete 🎉</h2>
        <p class="muted">You finished the <b>${depth}</b> set. ${profileCompleteness().pct}% of total profile done.</p>
        <div class="row" style="justify-content:center; margin-top:16px;">
          <button class="btn warm" onclick="generateMatches()">generate matches →</button>
          <button class="btn" onclick="go('quiz',{depth:'comprehensive'})">keep going (comprehensive) →</button>
          <button class="btn" onclick="go('profile')">see profile →</button>
          <button class="btn ghost" onclick="go('home')">home</button>
        </div>
      </div>`;
    return;
  }
  const q = pool[idx];
  const p = Store.profile();
  const existing = p.answers[q.id];

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="qhead">
      <div>// ${escapeHTML(depth)} · question ${idx+1} of ${pool.length}</div>
      <div class="right">
        <span>${profileCompleteness().pct}% profile</span>
        <button class="btn ghost" style="padding:4px 10px;" onclick="go('home')">save & exit</button>
      </div>
    </div>
    <div class="qcard">
      <div class="qcategory">// ${escapeHTML(q.category)} · ${escapeHTML(q.type)}</div>
      <div class="qtext">${escapeHTML(q.text)}</div>
      ${q.hint ? `<div class="qhint">${escapeHTML(q.hint)}</div>` : ''}
      <div id="qbody"></div>
      <div class="qactions">
        <button class="btn ghost" onclick="quizPrev()" ${idx===0?'disabled':''}>← back</button>
        <div class="right">
          ${q.optional ? `<button class="btn ghost" onclick="quizSkip()">skip</button>` : ''}
          <button class="btn primary" id="qnext">${idx === pool.length - 1 ? 'finish ✓' : 'next →'}</button>
        </div>
      </div>
    </div>
  `;

  renderers[q.type](q, existing, document.getElementById('qbody'));

  document.getElementById('qnext').addEventListener('click', () => {
    const val = collectAnswer(q);
    if (val === null && !q.optional) { toast('pick an answer first'); return; }
    saveAnswerAndAdvance(q, val);
  });
}

function quizPrev() {
  if (!quizState || quizState.idx === 0) return;
  quizState.idx--;
  renderCurrentQuestion();
}
function quizSkip() {
  if (!quizState) return;
  quizState.idx++;
  renderCurrentQuestion();
}
function saveAnswerAndAdvance(q, val) {
  if (val !== null) {
    const p = Store.profile();
    p.answers[q.id] = val;
    Store.saveProfile(p);
  }
  quizState.idx++;
  renderCurrentQuestion();
}

const renderers = {};

renderers['likert'] = (q, existing, root) => {

  root.querySelectorAll('button').forEach(b => {

      b.classList.add('selected');

};

renderers['slider'] = (q, existing, root) => {
  const min = q.min ?? 0, max = q.max ?? 100;
  const mid = Math.round((min+max)/2);
  const val = existing ?? mid;
  pendingAnswer = val;
  root.innerHTML = `
    <div class="slider-row">
      <div class="label">${escapeHTML(q.left||'')}</div>
      <input type="range" min="${min}" max="${max}" step="${q.step||1}" value="${val}" id="slid">
      <div class="label right">${escapeHTML(q.right||'')}</div>

renderers['binary'] = (q, existing, root) => {
  pendingAnswer = existing ?? null;

      <div class="body">${escapeHTML(q.optionA)}</div>
    </div>
    <div class="opt ${existing==='B'?'selected':''}" data-val="B">

      <div class="body">${escapeHTML(q.optionB)}</div>
    </div>

  root.querySelectorAll('.opt').forEach(o => {

renderers['multi-select'] = (q, existing, root) => {

  pendingAnswer = Array.from(sel);

    ${q.options.map(opt => `<button data-val="${escapeAttr(opt)}" class="${sel.has(opt)?'selected':''}">${escapeHTML(opt)}</button>`).join('')}
  </div>`;

        <div class="opt ${sel.has(opt.label)?'selected':''}" data-val="${escapeAttr(opt.label)}">
          <div class="badge">${sel.has(opt.label) ? Array.from(sel).indexOf(opt.label)+1 : ''}</div>
          <div class="emo">${opt.emoji}</div>
          <div class="lbl">${escapeHTML(opt.label)}</div>
        </div>
      `).join('')}
    </div>
    <div class="muted mono" style="font-size:12px; margin-top:10px; text-align:center;">pick ${q.pickCount} · ${sel.size}/${q.pickCount} selected</div>`;
    root.querySelectorAll('.opt').forEach(o => {
      o.addEventListener('click', () => {
        const v = o.dataset.val;
        if (sel.has(v)) { sel.delete(v); }
        else {
          if (sel.size >= q.pickCount) { toast(`only pick ${q.pickCount}`); return; }
          sel.add(v);
        }
        pendingAnswer = Array.from(sel);
        paint();
      });
    });
  }
  paint();
};

renderers['open-text'] = (q, existing, root) => {
  pendingAnswer = existing ?? '';
  root.innerHTML = `<textarea id="opentxt" rows="4" placeholder="optional...">${escapeHTML(existing||'')}</textarea>`;
  document.getElementById('opentxt').addEventListener('input', e => {
    pendingAnswer = e.target.value;
  });
};

function collectAnswer(q) {
  if (q.type === 'multi-select' || q.type === 'image-pref') {
    return (pendingAnswer && pendingAnswer.length > 0) ? pendingAnswer : (q.optional ? [] : null);
  }
  if (q.type === 'open-text') return pendingAnswer || (q.optional ? '' : null);
  return pendingAnswer;
}

- You know the Indian education landscape: JEE (Mains/Advanced), NEET, CUET, CLAT, NID/NIFT, CA Foundation, UPSC, GATE, CAT, NDA, NATA, ICAR, BITSAT, AIIMS, NLU, IIM, IIT, NIT, IIIT, IISc, IISER, top private universities (Ashoka, Krea, Plaksha, Mahindra, Shiv Nadar, OP Jindal, Manipal, VIT, SRM), and realistic abroad options for Indian students (US/UK/EU/Canada/Australia/Singapore, with realistic costs and visa/work realities).

function buildProfilePayload() {
  const p = Store.profile();
  const out = {};
  QUESTIONS.forEach(q => {
    const a = p.answers[q.id];
    if (a === undefined || a === null || a === '') return;
    out[q.id] = {
      q: q.text,
      cat: q.category,
      type: q.type,
      a: formatAnswer(q, a)
    };
  });
  return out;
}

async function callClaude({ system, messages, tools, tool_choice, model, maxTokens=4096 }) {
  const s = Store.settings();
  if (!s.apiKey) throw new Error('No API key set. Open Settings and paste your Anthropic API key.');
  const body = {
    model: model || s.model,
    max_tokens: maxTokens,
    system,
    messages
  };
  if (tools) body.tools = tools;
  if (tool_choice) body.tool_choice = tool_choice;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': s.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`API ${res.status}: ${txt}`);
  }
  return res.json();
}

function askFollowup(title) {
  document.getElementById('chatinp').value = `Tell me more about ${title} — specifically how it might or might not fit me, and what I should worry about.`;
  document.getElementById('chatinp').focus();
  document.getElementById('chat-area').scrollIntoView({behavior:'smooth'});
}

function renderChatArea() {
  const chat = Store.chat();
  const area = document.getElementById('chat-area');
  if (!area) return;
  if (chat.length === 0) { area.innerHTML = ''; return; }
  area.innerHTML = `<div class="chat">${chat.map(m => `
    <div class="bubble ${m.role}">${escapeHTML(m.content).replace(/\n/g,'<br>')}</div>
  `).join('')}</div>`;
  area.scrollTop = area.scrollHeight;
}

async function sendChat() {
  const inp = document.getElementById('chatinp');
  const q = inp.value.trim();
  if (!q) return;
  inp.value = '';
  const chat = Store.chat();
  chat.push({ role: 'user', content: q });
  Store.saveChat(chat);
  renderChatArea();

  const area = document.getElementById('chat-area');
  area.innerHTML += `<div class="chat"><div class="bubble bot"><span class="spinner"></span> thinking...</div></div>`;

  try {
    const profile = buildProfilePayload();
    const results = Store.results();
    const context = `STUDENT PROFILE (raw answers):
\`\`\`json
${JSON.stringify(profile, null, 2)}
\`\`\`

PREVIOUS MATCHES YOU GENERATED:
\`\`\`json
${JSON.stringify({ overall_pattern: results.overall_pattern, matches: results.matches.map(m => ({ title:m.title, why_fits:m.why_fits, ai_resilience_score:m.ai_resilience_score })), stretch: results.stretch_recommendations }, null, 2)}
\`\`\``;

    const messages = [
      { role: 'user', content: context + '\n\nThe student now wants to ask follow-up questions about these matches. Answer warmly but bluntly, citing specific profile signals when relevant. Push back on engineering-by-default if it comes up. Keep responses 3–8 sentences unless they ask for more depth.' },
      { role: 'assistant', content: 'Understood — I have their profile and my previous matches in context. Ready for their question.' },
      ...chat.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content }))
    ];

    const resp = await callClaude({
      system: SYSTEM_PROMPT,
      messages,
      maxTokens: 1500
    });
    const reply = resp.content.filter(c => c.type === 'text').map(c => c.text).join('\n').trim();
    chat.push({ role: 'assistant', content: reply });
    Store.saveChat(chat);
    renderChatArea();
  } catch (err) {
    chat.push({ role: 'assistant', content: 'Error: ' + err.message });
    Store.saveChat(chat);
    renderChatArea();
  }
}

function escapeHTML(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s) { return escapeHTML(s); }

let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
